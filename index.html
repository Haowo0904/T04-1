<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T04 – SVG House &amp; Garden</title>
  <style>
    body { margin: 0; padding: 16px; background: #f4f6f8; font-family: Arial, sans-serif; }
    svg { display: block; width: 100%; max-width: 1200px; height: auto; margin: auto; border: 2px solid #c5ced5; border-radius: 4px; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc">
    <title id="scene-title">House and Garden</title>
    <desc id="scene-desc">A sunny garden with a cloud, a tree, and a cream house with a red roof, chimney, door, and two blue windows. A white fence borders the house, and a curved walkway leads to its door.</desc>

    <!-- Sky and grass -->
    <rect width="800" height="500" fill="#87cee5" />
    <rect y="250" width="800" height="250" fill="#7fc64b" />

    <!-- Sun and cloud -->
    <circle cx="100" cy="100" r="40" fill="#ffe36b" stroke="#ffd700" stroke-width="4" />
    <ellipse cx="220" cy="90" rx="40" ry="25" fill="#f2fbff" />
    <circle cx="200" cy="90" r="20" fill="white" />
    <circle cx="240" cy="90" r="19" fill="white" />

    <!-- Tree -->
    <rect x="650" y="295" width="20" height="65" fill="#8b5a2b" />
    <circle cx="660" cy="290" r="35" fill="#228b22" />

    <!-- House, roof, chimney, and smoke -->
    <rect x="320" y="220" width="160" height="120" fill="#ffe5b5" stroke="#c77822" stroke-width="3" />
    <polygon points="300,220 400,150 500,220" fill="#b22222" stroke="#8b0000" stroke-width="3" />
    <rect x="440" y="160" width="20" height="40" fill="#a0522d" stroke="#936331" stroke-width="2" />
    <g fill="#e2edf0">
      <ellipse cx="450" cy="150" rx="10" ry="6" opacity="0.85" />
      <ellipse cx="455" cy="140" rx="7" ry="4" opacity="0.65" />
      <ellipse cx="460" cy="130" rx="5" ry="3" opacity="0.45" />
    </g>

    <!-- Door and two windows with line-shaped panes -->
    <rect x="385" y="280" width="30" height="60" fill="#deb887" stroke="#8b5a2b" stroke-width="2" />
    <circle cx="410" cy="310" r="4" fill="#8b5a2b" />
    <g fill="#a6d8ee" stroke="#508ab0" stroke-width="2">
      <rect x="340" y="240" width="35" height="30" />
      <line x1="357.5" y1="240" x2="357.5" y2="270" />
      <line x1="340" y1="255" x2="375" y2="255" />
      <rect x="430" y="240" width="35" height="30" />
      <line x1="447.5" y1="240" x2="447.5" y2="270" />
      <line x1="430" y1="255" x2="465" y2="255" />
    </g>

    <!-- Curved garden walkway -->
    <path d="M 400 340 C 435 420, 375 530, 320 400" fill="none" stroke="#dec397" stroke-width="8" />
    <g fill="#dce5cf" opacity="0.85">
      <ellipse cx="400" cy="355" rx="10" ry="6" />
      <ellipse cx="410" cy="370" rx="11" ry="7" />
      <ellipse cx="405" cy="390" rx="9" ry="6" />
      <ellipse cx="395" cy="410" rx="10" ry="7" />
      <ellipse cx="380" cy="430" rx="11" ry="7" />
      <ellipse cx="365" cy="445" rx="10" ry="6" />
      <ellipse cx="350" cy="440" rx="9" ry="6" />
    </g>

    <!-- Fence: one continuous polyline traces posts and pointed tops -->
    <polyline points="200,380 200,340 220,330 240,340 240,380 240,340 260,330 280,340 280,380 280,340 300,330 320,340 320,380 320,340 340,330 360,340 360,380 360,340 380,330 400,340 400,380 400,340 420,330 440,340 440,380 440,340 460,330 480,340 480,380 480,340 500,330 520,340 520,380 520,340 540,330 560,340 560,380" fill="none" stroke="#fff8dc" stroke-width="6" />

    <!-- Mailbox and caption -->
    <rect x="182" y="350" width="8" height="20" fill="#8b5a2b" />
    <rect x="177" y="330" width="18" height="22" rx="4" fill="#b0c4de" stroke="#38434a" stroke-width="2" />
    <text x="186" y="345" font-size="10" fill="#303030">MAIL</text>
    <text x="400" y="490" text-anchor="middle" font-size="24" fill="#303030">Welcome to the House &amp; Garden</text>
  </svg>
</body>
</html>
